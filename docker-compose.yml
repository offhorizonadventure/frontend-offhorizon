x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Named for the site, not for its job.
  #
  # Compose gives every service its own name as a DNS alias on each network it
  # joins. Called `web`, this answered to `web` on the shared network that the
  # other site's Caddy also sits on, where its own app already answers to `web`.
  # One ambiguous name on a network two live sites share is a coin toss over
  # which one a visitor gets. It is also the name the front door looks for.
  offhorizon-web:
    # Keeps the container itself recognisable at a glance in `docker ps`.
    container_name: offhorizon-web-1
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_TERMLY_ID: ${NEXT_PUBLIC_TERMLY_ID}
    restart: unless-stopped
    logging: *default-logging
    # Never published to the host, so nobody can reach the app on the VPS IP
    # over plain HTTP and skip TLS entirely.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
      NEXT_PUBLIC_TERMLY_ID: ${NEXT_PUBLIC_TERMLY_ID}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SITE_REVALIDATE_SECRET: ${SITE_REVALIDATE_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      # Optimised images live here. On a tmpfs they were thrown away on every
      # restart, so the first visitor after each deploy paid for every image on
      # the site to be re-encoded, and the 256m ceiling quietly evicted the rest.
      # A named volume keeps them across deploys.
      - next_cache:/app/.next/cache
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - web
      # The shared network the front door sits on. Without this the app has to
      # be attached by hand after every recreate, and a `compose down` silently
      # cuts the site off while the container itself looks perfectly healthy.
      - proxy

  # Only started when asked for: `docker compose --profile edge up -d`.
  #
  # This server already has a Caddy in front of both sites, holding 80 and 443
  # and proxying to each. Starting a second one just fails on the port and
  # takes the deploy down with it, so it stays out of the way unless it is the
  # one doing the job.
  caddy:
    profiles:
      - edge
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates persist. Without this Caddy re-issues on every deploy and
      # hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    security_opt:
      - no-new-privileges:true
    depends_on:
      - offhorizon-web
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
  next_cache:

networks:
  web:

  # Created outside this file and shared with the other site on the same
  # server, whose Caddy holds 80 and 443 and proxies to both. Declared external
  # so compose joins it rather than trying to own it:
  #
  #   docker network create proxy
  #
  proxy:
    external: true
